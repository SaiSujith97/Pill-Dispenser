<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="PillSync — Smart medication management for elderly patients and caregivers. Never miss a dose again."
    />
    <meta name="theme-color" content="#5B8A72" />
    <title>PillDispenser — Smart Pill Dispenser</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/pages.css" />
  </head>
  <body>
    <div id="app" class="app-shell">
      <!-- ─── Sidebar (Tablet / Desktop) ─── -->
      <nav
        id="sidebar"
        class="sidebar"
        role="navigation"
        aria-label="Main navigation"
      >
        <div class="sidebar-brand">
          <div class="brand-logo">
            <svg
              width="38"
              height="38"
              viewBox="0 0 38 38"
              fill="none"
              aria-hidden="true"
            >
              <rect width="38" height="38" rx="11" fill="var(--accent)" />
              <ellipse
                cx="19"
                cy="19"
                rx="9.5"
                ry="5.8"
                transform="rotate(45 19 19)"
                fill="white"
                opacity="0.95"
              />
              <ellipse
                cx="19"
                cy="19"
                rx="4.8"
                ry="5.8"
                transform="rotate(45 19 19)"
                fill="var(--accent)"
              />
            </svg>
          </div>
          <div class="brand-text">
            <span class="brand-name">PillDispneser</span>
            <span class="brand-tagline">Medication Manager</span>
          </div>
        </div>

        <ul class="sidebar-nav" role="list">
          <li>
            <a href="#dashboard" class="nav-item" data-page="dashboard">
              <svg
                class="ni"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <rect x="3" y="3" width="7" height="7" rx="1.5" />
                <rect x="14" y="3" width="7" height="7" rx="1.5" />
                <rect x="3" y="14" width="7" height="7" rx="1.5" />
                <rect x="14" y="14" width="7" height="7" rx="1.5" />
              </svg>
              <span>Dashboard</span>
            </a>
          </li>
          <li>
            <a href="#medications" class="nav-item" data-page="medications">
              <svg
                class="ni"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="m10.5 20.5-3-3m9.5-9.5-6.5 6.5" />
                <path d="M15 3l6 6-3 3-6-6z" />
                <path d="M9 9l-6 6 3 3 6-6z" />
              </svg>
              <span>Medications</span>
            </a>
          </li>
          <li>
            <a href="#schedule" class="nav-item" data-page="schedule">
              <svg
                class="ni"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <rect x="3" y="4" width="18" height="18" rx="2" />
                <line x1="16" y1="2" x2="16" y2="6" />
                <line x1="8" y1="2" x2="8" y2="6" />
                <line x1="3" y1="10" x2="21" y2="10" />
              </svg>
              <span>Schedule</span>
            </a>
          </li>
          <li>
            <a href="#dispenser" class="nav-item" data-page="dispenser">
              <svg
                class="ni"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <rect x="5" y="2" width="14" height="20" rx="2" />
                <line x1="9" y1="9" x2="15" y2="9" />
                <line x1="9" y1="13" x2="15" y2="13" />
                <line x1="9" y1="17" x2="13" y2="17" />
              </svg>
              <span>Dispenser</span>
            </a>
          </li>
          <li>
            <a href="#reminders" class="nav-item" data-page="reminders">
              <span class="nav-icon-wrap">
                <svg
                  class="ni"
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
                  <path d="M13.73 21a2 2 0 0 1-3.46 0" />
                </svg>
                <span class="badge-dot hidden" id="sidebar-dot"></span>
              </span>
              <span>Reminders</span>
            </a>
          </li>
          <li>
            <a href="#caregiver" class="nav-item" data-page="caregiver">
              <svg
                class="ni"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                <circle cx="9" cy="7" r="4" />
                <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
                <path d="M16 3.13a4 4 0 0 1 0 7.75" />
              </svg>
              <span>Caregiver</span>
            </a>
          </li>
          <li>
            <a href="#settings" class="nav-item" data-page="settings">
              <svg
                class="ni"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <circle cx="12" cy="12" r="3" />
                <path
                  d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
                />
              </svg>
              <span>Settings</span>
            </a>
          </li>
        </ul>

        <div class="sidebar-footer">
          <div class="sf-avatar" id="sf-avatar" aria-hidden="true">MJ</div>
          <div class="sf-info">
            <span class="sf-name">Mary Johnson</span>
            <span class="sf-role">Patient</span>
          </div>
          <button
            class="icon-btn theme-toggle"
            id="theme-toggle"
            aria-label="Toggle dark/light mode"
            title="Toggle theme"
          >
            <svg
              class="sun-icon"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="5" />
              <line x1="12" y1="1" x2="12" y2="3" />
              <line x1="12" y1="21" x2="12" y2="23" />
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
              <line x1="1" y1="12" x2="3" y2="12" />
              <line x1="21" y1="12" x2="23" y2="12" />
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
            </svg>
            <svg
              class="moon-icon"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              style="display: none"
            >
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
            </svg>
          </button>
        </div>
      </nav>

      <!-- ─── Main Wrapper ─── -->
      <div class="main-wrapper">
        <!-- Mobile / Tablet Top Bar -->
        <header class="topbar" id="topbar" role="banner">
          <div class="topbar-left">
            <div class="topbar-brand">
              <svg
                width="28"
                height="28"
                viewBox="0 0 38 38"
                fill="none"
                aria-hidden="true"
              >
                <rect width="38" height="38" rx="11" fill="var(--accent)" />
                <ellipse
                  cx="19"
                  cy="19"
                  rx="9.5"
                  ry="5.8"
                  transform="rotate(45 19 19)"
                  fill="white"
                  opacity="0.95"
                />
                <ellipse
                  cx="19"
                  cy="19"
                  rx="4.8"
                  ry="5.8"
                  transform="rotate(45 19 19)"
                  fill="var(--accent)"
                />
              </svg>
              <span class="topbar-app-name">PillSync</span>
            </div>
          </div>
          <div class="topbar-right">
            <button
              class="icon-btn theme-toggle"
              id="theme-toggle-mobile"
              aria-label="Toggle dark/light mode"
            >
              <svg
                class="sun-icon"
                width="22"
                height="22"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <circle cx="12" cy="12" r="5" />
                <line x1="12" y1="1" x2="12" y2="3" />
                <line x1="12" y1="21" x2="12" y2="23" />
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
                <line x1="1" y1="12" x2="3" y2="12" />
                <line x1="21" y1="12" x2="23" y2="12" />
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
              </svg>
              <svg
                class="moon-icon"
                width="22"
                height="22"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                style="display: none"
              >
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
              </svg>
            </button>
          </div>
        </header>

        <!-- Page content injected here -->
        <main
          id="app-content"
          role="main"
          tabindex="-1"
          aria-live="polite"
        ></main>
      </div>

      <!-- ─── Bottom Navigation (Mobile / small Tablet) ─── -->
      <nav
        class="bottom-nav"
        id="bottom-nav"
        role="navigation"
        aria-label="Mobile navigation"
      >
        <a
          href="#dashboard"
          class="bnav-item"
          data-page="dashboard"
          aria-label="Home dashboard"
        >
          <svg
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect x="3" y="3" width="7" height="7" rx="1.5" />
            <rect x="14" y="3" width="7" height="7" rx="1.5" />
            <rect x="3" y="14" width="7" height="7" rx="1.5" />
            <rect x="14" y="14" width="7" height="7" rx="1.5" />
          </svg>
          <span>Home</span>
        </a>
        <a
          href="#medications"
          class="bnav-item"
          data-page="medications"
          aria-label="Medications"
        >
          <svg
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="m10.5 20.5-3-3m9.5-9.5-6.5 6.5" />
            <path d="M15 3l6 6-3 3-6-6z" />
            <path d="M9 9l-6 6 3 3 6-6z" />
          </svg>
          <span>Meds</span>
        </a>
        <a
          href="#reminders"
          class="bnav-item"
          data-page="reminders"
          aria-label="Reminders and alerts"
        >
          <span class="bnav-icon-wrap">
            <svg
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
              <path d="M13.73 21a2 2 0 0 1-3.46 0" />
            </svg>
            <span
              class="bnav-badge hidden"
              id="bnav-badge"
              aria-label="1 unread reminder"
              >1</span
            >
          </span>
          <span>Alerts</span>
        </a>
        <a
          href="#schedule"
          class="bnav-item"
          data-page="schedule"
          aria-label="Schedule and history"
        >
          <svg
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect x="3" y="4" width="18" height="18" rx="2" />
            <line x1="16" y1="2" x2="16" y2="6" />
            <line x1="8" y1="2" x2="8" y2="6" />
            <line x1="3" y1="10" x2="21" y2="10" />
          </svg>
          <span>History</span>
        </a>
        <a
          href="#dispenser"
          class="bnav-item"
          data-page="dispenser"
          aria-label="Dispenser control panel"
        >
          <svg
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect x="5" y="2" width="14" height="20" rx="2" />
            <line x1="9" y1="9" x2="15" y2="9" />
            <line x1="9" y1="13" x2="15" y2="13" />
            <line x1="9" y1="17" x2="13" y2="17" />
          </svg>

        </a>
        <a
          href="#settings"
          class="bnav-item"
          data-page="settings"
          aria-label="Profile and settings"
        >
          <svg
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="12" cy="7" r="4" />
            <path d="M3 21v-2a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4v2" />
          </svg>
          <span>Profile</span>
        </a>
      </nav>
    </div>
    <!-- /#app -->

    <!-- ─── Modal Overlay ─── -->
    <div
      id="modal-overlay"
      class="modal-overlay"
      aria-hidden="true"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modal-title"
    >
      <div class="modal-box" id="modal-box" role="document">
        <div id="modal-inner"></div>
      </div>
    </div>

    <!-- ─── Toast Container ─── -->
    <div
      id="toast-container"
      class="toast-container"
      aria-live="polite"
      aria-atomic="false"
    ></div>

    <!-- ─── Scripts (order matters) ─── -->
    <!-- firebase.js is type="module" — browser defers it automatically.
       It sets up onAuthStateChanged, then dispatches 'FirebaseReady'.
       app.js listens for 'FirebaseReady' before calling Router.init(). -->
    <script type="module" src="js/firebase.js"></script>

    <!-- Classic global scripts loaded synchronously before DOMContentLoaded -->
    <script src="js/data.js"></script>
    <script src="js/state.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/components.js"></script>
    <script src="js/pages/landing.js"></script>
    <script src="js/pages/auth.js"></script>
    <script src="js/pages/dashboard.js"></script>
    <script src="js/pages/medications.js"></script>
    <script src="js/pages/schedule.js"></script>
    <script src="js/pages/reminders.js"></script>
    <script src="js/pages/caregiver.js"></script>
    <script src="js/pages/settings.js"></script>
    <script src="js/pages/dispenser.js"></script>
    <script src="js/router.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
